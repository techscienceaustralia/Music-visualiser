<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visualiser">
<meta name="theme-color" content="#000000">
<title>Mic Visualiser Test</title>
<style>
  :root {
    --bg: #000;
    --ink: #f4eefc;
    --dim: rgba(244, 238, 252, 0.62);
    --glass: rgba(18, 10, 30, 0.62);
    --accent: #ff4fd8;
    --accent2: #46e6ff;
    --ok: #6dff9e;
    --warn: #ffcf5a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  [hidden] { display: none !important; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }

  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: radial-gradient(120% 80% at 50% 30%, #3a0d5c 0%, #12051f 55%, #000 100%); }
  #intro h1 { margin: 0; font-size: 2rem; line-height: 1.1; text-wrap: balance; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #intro p { margin: 0; max-width: 32ch; color: var(--dim); font-size: 1rem; line-height: 1.45; }
  #start { appearance: none; border: 0; border-radius: 999px; padding: 16px 34px; font: 600 1.1rem var(--font); color: #000; background: linear-gradient(90deg, var(--accent), var(--accent2)); cursor: pointer; }
  #start:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #err { color: var(--warn); max-width: 34ch; font-size: .95rem; line-height: 1.4; }

  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: .8rem; color: var(--dim); transition: opacity .6s; }
  #hud.faded { opacity: 0; pointer-events: none; }
  #meter { flex: 0 0 70px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--accent)); }
  #name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: .8rem; color: var(--dim); transition: opacity .6s; pointer-events: none; }
  #hint.faded { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #hud, #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <h1>Music Visualiser</h1>
  <p>Start Spotify playing through the iPhone speaker (not AirPods), then tap Start and allow the microphone.</p>
  <button id="start" type="button">Start</button>
  <div id="err" hidden></div>
</div>

<div id="hint" hidden>Tap: next look &nbsp;·&nbsp; Hold: keep this look</div>
<div id="hud" hidden>
  <div id="meter"><div id="meterFill"></div></div>
  <div id="name">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('c');
  const SWITCH_MS = 22000, BLEND_S = 2.7;
  let ctx, viz, analyser, presets, names = [], current = -1, locked = false, lastSwitch = 0, wakeLock = null, hudTimer;

  function showError(msg) { const e = $('err'); e.textContent = msg; e.hidden = false; }

  function size() {
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(window.innerWidth * pr), h = Math.round(window.innerHeight * pr);
    canvas.width = w; canvas.height = h;
    if (viz) viz.setRendererSize(w, h);
  }

  function nextPreset(blend = BLEND_S) {
    let i;
    do { i = Math.floor(Math.random() * names.length); } while (names.length > 1 && i === current);
    current = i;
    viz.loadPreset(presets[names[i]], blend);
    $('name').textContent = names[i];
    lastSwitch = performance.now();
  }

  function pokeHud() {
    $('hud').classList.remove('faded'); $('hint').classList.remove('faded');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => { $('hud').classList.add('faded'); $('hint').classList.add('faded'); }, 4000);
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }

  async function start() {
    $('start').disabled = true;
    try {
      const bc = window.butterchurn && (window.butterchurn.default || window.butterchurn);
      const bp = window.butterchurnPresets && (window.butterchurnPresets.default || window.butterchurnPresets);
      if (!bc || !bp) throw new Error('The visual engine did not load. Check your internet connection and reload.');

      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      const src = ctx.createMediaStreamSource(stream);
      // Mic sounds quieter than a line signal, so boost it a little before the visuals see it.
      const gain = ctx.createGain(); gain.gain.value = 2.2;
      src.connect(gain);
      analyser = ctx.createAnalyser(); analyser.fftSize = 512;
      gain.connect(analyser);
      if (ctx.state === 'suspended') await ctx.resume();

      size();
      viz = bc.createVisualizer(ctx, canvas, { width: canvas.width, height: canvas.height, pixelRatio: 1, textureRatio: 1 });
      viz.connectAudio(gain);

      presets = bp.getPresets();
      names = Object.keys(presets);
      nextPreset(0);

      $('intro').hidden = true; $('hud').hidden = false; $('hint').hidden = false;
      pokeHud(); keepAwake();
      requestAnimationFrame(loop);
    } catch (e) {
      $('start').disabled = false;
      const name = e && e.name;
      if (name === 'NotAllowedError') showError('Microphone access was blocked. In Settings > Safari > Microphone, choose Allow or Ask, then reload this page.');
      else if (name === 'NotFoundError') showError('No microphone was found.');
      else showError((e && e.message) || 'Something went wrong starting the visualiser.');
    }
  }

  const buf = new Uint8Array(512);
  function loop(t) {
    viz.render();
    analyser.getByteTimeDomainData(buf);
    let peak = 0; for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128); if (v > peak) peak = v; }
    $('meterFill').style.width = Math.min(100, peak / 128 * 140) + '%';
    if (!locked && t - lastSwitch > SWITCH_MS) nextPreset();
    requestAnimationFrame(loop);
  }

  // Tap for the next look; press and hold to lock the current one.
  let holdTimer, held = false;
  canvas.addEventListener('pointerdown', () => {
    if (!viz) return;
    held = false;
    holdTimer = setTimeout(() => { held = true; locked = !locked; $('name').textContent = (locked ? '🔒 ' : '') + names[current]; pokeHud(); }, 600);
  });
  canvas.addEventListener('pointerup', () => {
    if (!viz) return;
    clearTimeout(holdTimer);
    if (!held) { nextPreset(); pokeHud(); }
  });

  $('start').addEventListener('click', start);
  window.addEventListener('resize', size);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); if (ctx && ctx.state !== 'running') ctx.resume(); }
  });
})();
</script>
</body>
</html>
